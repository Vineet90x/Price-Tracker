# Continuous Integration: on every push and pull request, GitHub starts fresh Linux machines and runs
# every check we otherwise run by hand. A red ❌ on a commit means one of these failed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older, still-running check (saves minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (unit tests + production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact dependencies (fails if package.json and the lock file disagree)
        run: npm ci
      - name: Unit tests
        run: npx ng test --watch=false
      - name: Production build (also checks templates and the bundle budget)
        run: npx ng build

  backend:
    name: Backend (end-to-end alerts + load-test budget)
    runs-on: ubuntu-latest
    services:
      # A real Redis next to the job, like docker-compose does locally
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      ENABLE_BINANCE: "false" # no calls to outside services in tests; simulated stocks still tick
      REDIS_URL: redis://localhost:6379/0
      DATABASE_URL: sqlite:///./data/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Start the backend in the background
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --port 8000 > ../backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
          sleep 5 # let the simulated feed publish a few prices
      - name: End-to-end alert tests (13 checks)
        working-directory: backend
        run: python tests/e2e_alerts.py
      - name: Load test with a performance budget (slow clients must not slow others down)
        run: python tools/loadtest/ws_load.py slow --fast 20 --slow 2 --rate 50 --seconds 10 --max-p95 500
      - name: Backend log (shown when something failed)
        if: failure()
        run: cat backend.log

  docs:
    name: Docs (every link points at an existing file and line)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_doc_links.py

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend and frontend images
        run: |
          docker build -t price-tracker-backend ./backend
          docker build -t price-tracker-frontend ./frontend
