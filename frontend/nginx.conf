# "Connection: upgrade" only when the client asked to upgrade (WebSocket); plain requests get "close".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects stay relative. Absolute ones would use nginx's internal port (80), not the
    # published one (4200), and send the browser to a dead address.
    absolute_redirect off;

    # Angular routing: real file → prerendered page (/watchlist → watchlist/index.html, no
    # trailing-slash redirect) → otherwise the client-side app shell.
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # Backend API + WebSocket on the SAME origin as the app: no CORS, and the
    # SameSite=Strict refresh cookie just works.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h; # WebSockets are long-lived; nginx's 60 s default would cut idle ones
    }

    # Cache static assets (CSS, JS, media, fonts) for enhanced performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Gzip Compression for fast delivery
    gzip on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
}
