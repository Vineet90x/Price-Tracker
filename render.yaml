services:
  - type: web
    name: price-tracker-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: singapore # not a US region: Binance blocks US IPs
    plan: starter # always on + allows a disk
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /app/data # SQLite file lives here and survives redeploys
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        value: sqlite:////app/data/app.db
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: price-tracker-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render creates a random secret for you
      - key: COOKIE_SECURE
        value: "true"
      - key: ACCESS_TOKEN_SECONDS
        value: "900"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: ENABLE_BINANCE
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false # Render asks you for this value on first deploy (can be left empty)

  - type: keyvalue
    name: price-tracker-redis
    region: singapore
    plan: free
    ipAllowList: [] # reachable only from your Render services